name: Auto Publish ZAGUÁN Scheduled Posts (Cloud 24/7)

on:
  schedule:
    # Martes (2), Jueves (4) y Sábados (6) a las 11:00 hs Uruguay/Argentina (14:00 UTC)
    - cron: '0 14 * * 2,4,6'
  workflow_dispatch:
    inputs:
      force_post_id:
        description: 'ID opcional de pieza a publicar ahora (ej. 03)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ZAGUÁN Cloud Publisher
        env:
          ZAGUAN_SOCIAL_KEYS_JSON: ${{ secrets.ZAGUAN_SOCIAL_KEYS_JSON }}
          FORCE_POST_ID: ${{ github.event.inputs.force_post_id }}
        run: python3 cloud_publisher.py

      - name: Commit updated schedule state
        run: |
          git config user.name "ZAGUÁN Cloud Publisher"
          git config user.email "zaguanpropiedades@gmail.com"
          if ! git diff --quiet calendario_programado.json; then
            git add calendario_programado.json
            git commit -m "chore(schedule): update published status from Cloud Publisher [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
