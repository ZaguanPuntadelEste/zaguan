<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propiedades | ZAGUÁN · Punta del Este · Maldonado</title>
<meta name="description" content="Propiedades en venta y alquiler en Punta del Este · Maldonado.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://zaguanpropiedades.com/propiedades/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/fichas.css">
<style>
:root{--b:#081521;--b2:#102632;--h:#f3f0e8;--text:#142028;--line:#cdd0c9;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--h);color:var(--text);font:16px/1.5 Inter,Arial,sans-serif}
.container{width:min(calc(100% - 42px),1216px);margin:0 auto}
header{background:var(--b);color:var(--h)}header .container{display:flex;justify-content:space-between;align-items:center;min-height:76px}
header img{height:30px;width:auto}header a{color:inherit;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;text-decoration:none}
h1{font:600 clamp(34px,4.5vw,56px)/1 Archivo,Arial,sans-serif;letter-spacing:-.045em;margin:48px 0 0}
.button{display:inline-flex;align-items:center;min-height:52px;padding:14px 19px;border:1px solid var(--b);background:var(--b);color:var(--h);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase}
</style>
</head>
<body>
<header><div class="container"><a href="/" aria-label="ZAGUÁN, inicio"><img src="/assets/brand/zaguan-white.png" alt="ZAGUÁN"></a><a href="/busqueda-personalizada/#formulario">Búsqueda personalizada</a></div></header>
<main class="container" id="app"><p class="eyebrow" style="margin-top:48px">Propiedades ZAGUÁN</p><h1>Propiedades.</h1><div id="view" aria-live="polite"></div></main>
<script>
(async()=>{
 const L='es', WA='/whatsapp/';
 const view=document.getElementById('view');
 const [tx,all]=await Promise.all([fetch('/data/taxonomias.json').then(r=>r.json()),fetch('/data/propiedades.json').then(r=>r.json())]);
 const data=all.filter(p=>p.publicado);
 const lab=(k,id)=>((tx[k]||[]).find(o=>o.id===id)||{})[L]||id||'';
 const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
 const money=p=>p.precio_a_consultar||p.precio==null?'Consultar':(p.moneda==='USD'?'USD ':'$U ')+p.precio.toLocaleString('es-UY');
 const tags=(p,wrap)=>{const w=el('div','tags'+(wrap?' '+wrap:''));
  w.append(el('span','tag tag--operacion',lab('operacion',p.operacion)));
  if(p.estado&&p.estado!=='disponible')w.append(el('span','tag tag--estado-'+p.estado,lab('estado',p.estado)));
  (p.atributos||[]).slice(0,2).forEach(a=>w.append(el('span','tag tag--atributo',lab('atributos',a))));return w};
 const media=p=>{const m=el('div','ficha-media');const i=p.imagenes&&p.imagenes[0];if(i){const im=el('img');im.src=i.src;im.alt=i.alt||'';im.loading='lazy';im.width=800;im.height=600;m.append(im)}m.append(tags(p));return m};
 const card=p=>{const a=el('a','ficha-card'+(p.estado==='cerrado'?' is-cerrado':''));a.href='?id='+encodeURIComponent(p.id);a.append(media(p));
  const b=el('div','ficha-body');b.append(el('p','ficha-code',p.id),el('h2','ficha-title',(p.titulo||{})[L]||''),
  el('p','ficha-meta',[lab('tipo',p.tipo),lab('zona',p.zona),p.superficie_total_m2?p.superficie_total_m2+' m²':''].filter(Boolean).join(' · ')),el('p','ficha-price',money(p)));a.append(b);return a};
 const empty=()=>{const d=el('div','empty');d.append(el('h2','ficha-title','Todavía no hay propiedades que coincidan.'),el('p','ficha-meta','Contanos qué buscás y te acercamos opciones, incluso las que aún no están publicadas.'));const a=el('a','button','Búsqueda personalizada');a.href='/busqueda-personalizada/#formulario';a.style.marginTop='20px';d.append(a);return d};
 const id=new URLSearchParams(location.search).get('id');
 if(id){const p=data.find(x=>x.id===id);
  if(!p){view.append(empty());return}
  document.title=((p.titulo||{})[L]||p.id)+' | ZAGUÁN';
  const d=el('div','detail');const l=el('div');l.append(media(p));
  const r=el('div');r.append(el('p','ficha-code',p.id),el('h1',null,(p.titulo||{})[L]||''),el('p','ficha-price',money(p)),el('p',null,(p.descripcion||{})[L]||''));
  const dl=el('dl');[['Operación',lab('operacion',p.operacion)],['Tipo',lab('tipo',p.tipo)],['Zona',lab('zona',p.zona)],['Superficie total',p.superficie_total_m2&&p.superficie_total_m2+' m²'],['Superficie cubierta',p.superficie_cubierta_m2&&p.superficie_cubierta_m2+' m²'],['Dormitorios',p.dormitorios],['Baños',p.banos],['Gastos comunes',p.gastos_comunes&&money({precio:p.gastos_comunes,moneda:p.moneda})],['Entrega',lab('entrega',p.entrega)]].forEach(([k,v])=>{if(v!=null&&v!==''&&v!==false){dl.append(el('dt',null,k),el('dd',null,String(v)))}});
  const wa=el('a','button','Consultar por WhatsApp');wa.href=WA+'?text='+encodeURIComponent('Hola, consulto por la ficha '+p.id);wa.target='_blank';wa.rel='noopener noreferrer';
  r.append(dl,wa);d.append(l,r);view.append(d);return}
 const f=el('div','filters');const state={};
 const sel=(k,name)=>{const lb=el('label',null,name);const s=el('select');s.append(new Option('Todos',''));(tx[k]||[]).filter(o=>data.some(p=>p[k]===o.id)).forEach(o=>s.append(new Option(o[L],o.id)));s.onchange=()=>{state[k]=s.value;draw()};lb.append(s);f.append(lb)};
 sel('operacion','Operación');sel('tipo','Tipo');sel('zona','Zona');
 const pm=el('label',null,'Precio máx.');const pi=el('input');pi.type='number';pi.min=0;pi.oninput=()=>{state.pmax=pi.value;draw()};pm.append(pi);f.append(pm);
 const grid=el('div','grid-fichas');view.append(f,grid);
 function draw(){grid.replaceChildren();const r=data.filter(p=>['operacion','tipo','zona'].every(k=>!state[k]||p[k]===state[k])&&(!state.pmax||p.precio==null||p.precio<=+state.pmax));
  if(!r.length){grid.append(empty());return}r.forEach(p=>grid.append(card(p)))}
 draw();
})().catch(()=>{document.getElementById('view').textContent='No pudimos cargar las propiedades.'});
</script>
</body>
</html>
