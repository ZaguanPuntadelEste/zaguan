  <style>
    :root {
      --zaguan-estuario: #123B4A;
      --zaguan-bigua: #081521;
      --zaguan-black: #05090D;
      --zaguan-bone: #F3F0E8;
      --zaguan-limestone: #E8E4DA;
      --zaguan-mist: #D9DDDA;
      --zaguan-feather: #66717A;
      --zaguan-umbral: #1B5463;

      --font-display: "Archivo", sans-serif;
      --font-body: "Inter", sans-serif;

      --radius: 16px;
      --focus-ring: 0 0 0 4px rgba(27, 84, 99, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--zaguan-bone);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--zaguan-bigua);
      background: var(--zaguan-bone);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .links-page {
      width: min(100%, 460px);
      text-align: center;
    }

    .brand {
      display: block;
      width: min(100%, 270px);
      height: auto;
      margin: 0 auto 36px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.08;
    }

    .intro {
      max-width: 34ch;
      margin: 16px auto 28px;
      color: var(--zaguan-feather);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.55;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 14px 20px;
      border: 1px solid var(--zaguan-estuario);
      border-radius: var(--radius);
      color: var(--zaguan-bone);
      background: var(--zaguan-estuario);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .action:hover {
      background: var(--zaguan-umbral);
      border-color: var(--zaguan-umbral);
    }

    .action:active {
      transform: translateY(1px);
    }

    .action.secondary {
      color: var(--zaguan-estuario);
      background: transparent;
    }

    .action.secondary:hover {
      color: var(--zaguan-bigua);
      border-color: var(--zaguan-umbral);
      background: var(--zaguan-limestone);
    }

    .action:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    footer {
      margin-top: 30px;
      color: var(--zaguan-feather);
      font-size: 0.8125rem;
      font-weight: 400;
    }

    @media (max-height: 700px) {
      main {
        align-items: start;
        padding-top: 28px;
      }

      .brand {
        width: 230px;
        margin-bottom: 24px;
      }

      .intro {
        margin: 12px auto 20px;
      }

      footer {
        margin-top: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .action {
        transition: none;
      }
    }
  </style>
</head>
