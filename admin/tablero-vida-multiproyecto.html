    .panel-head {

      align-items: center;
      justify-content: space-between;

                  <option value="la_fortuna" ${simContext === 'la_fortuna' ? 'selected' : ''}>Contexto: La Fortuna ($U 30.000/mes)</option>
                  <option value="santa_monica" ${simContext === 'santa_monica' ? 'selected' : ''}>Contexto: Santa Mónica (USD 160.000)</option>
                  <option value="pozo" ${simContext === 'pozo' ? 'selected' : ''}>Contexto: Pozo / Google Search</option>
                  <option value="dueno" ${simContext === 'dueno' ? 'selected' : ''}>Contexto: Dueño Directo</option>
                  <option value="general" ${simContext === 'general' ? 'selected' : ''}>Contexto: Automático sin ficha previa</option>
                </select>
                <input class="search-input" style="flex:1;min-width:180px;" type="search" placeholder="Filtrar casos rápidos (ej. mascota, 18.795, planos)..." oninput="filterSimChips(this.value)">
              </div>
              <textarea class="sim-input" id="simInputBox" rows="2" oninput="runSimLive()" placeholder="Pegá o escribí acá cualquier mensaje real que te mandó un interesado o dueño...">${esc(simInput)}</textarea>
              <div class="chip-wrap" id="simChipWrap"></div>
            </div>
            <div class="sim-output" id="simOutputBox"></div>
          </div>
        </section>
      `;
    }

    function renderSim32Audit() {
      const rows = sim32Data.resultados || [];
      const shown = showAllSimTable ? rows : rows.slice(0, 10);
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>🛡️ Corrida Red-Team Auditada: ${sim32Data.pasaron} / ${sim32Data.total} Escenarios PASS (${esc(sim32Data.tasa_exito || '100%')})</h2>
            <button class="proj-btn" onclick="toggleSimTable()">${showAllSimTable ? 'Mostrar resumen (10)' : 'Ver los 60 casos completos'}</button>
          </div>
          <div style="font-size:12px;color:var(--sky);margin-bottom:10px;">
            Antes de esta corrección el motor fallaba 22 de 32 casos (31% — "Buen día" contestaba La Fortuna y los pedidos de Santa Mónica USD 160k caían en alquiler). Hoy los 60 escenarios (32 base + 14 auditorías cruzadas de fichas HTML en disco + 14 casos de borde y Doble Punta + IVA) pasaron 100%.
          </div>
          <div class="table-wrap" style="max-height:360px;overflow:auto;">
            <table>
              <thead>
                <tr>
                  <th>ID / Bloque</th>
                  <th>Lo que escribe la persona</th>
                  <th>Vertical / Subtipo</th>
                  <th>Respuesta verificada</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody>
                ${shown.map(r => `
                  <tr>
                    <td><strong>${esc(r.id)}</strong><br><span style="color:var(--muted);font-size:11px;">${esc(r.bloque)}</span></td>
                    <td>${esc(r.input)}</td>
                    <td><span class="badge">${esc(r.vertical_detectada)}</span><br><span style="font-size:10.5px;color:var(--sky);">${esc(r.subtipo_detectado)}</span></td>
                    <td style="font-size:11.5px;">${esc(r.replyText)}</td>
                    <td><span class="badge ${r.pass ? 'badge-ok' : 'badge-andon'}">${r.pass ? 'PASS' : 'FAIL'}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    const ROTACION_VIDRIERA_AGENDA = [
      { fecha: 'Mar 24/11 · 09:00', accion: 'ALTA CON NOVEDAD', ref: 'ZAG-ALQ-07', prop: 'Pinares Parada 36 · Casa 3D + jardín (USD 1.500/mes)', regla: 'Entra etiqueta NOVEDAD (se quita el 01/12)' },
      { fecha: 'Mié 25/11 · 09:00', accion: 'PASAR A ALQUILADO', ref: 'ZAG-ALQ-01', prop: 'Playa Brava Parada 8 · 3D frente al mar (USD 1.700/mes)', regla: '🔒 ALQUILADO en web + OutOfStock + Pieza Aprobalo' },
      { fecha: 'Mar 01/12 · 09:00', accion: 'ROTACIÓN +7 DÍAS', ref: 'ZAG-ALQ-08', prop: 'Sale NOVEDAD de ZAG-ALQ-07 · Entra Parada 5 Brava 2D ($U 58.000/mes)', regla: 'Nueva etiqueta NOVEDAD por 7 días' },
      { fecha: 'Jue 03/12 · 09:00', accion: 'PASAR A ALQUILADO', ref: 'ZAG-ALQ-02', prop: 'Roosevelt y Cantegril · 2D a estrenar ($U 70.000/mes)', regla: '🔒 ALQUILADO +2 días tras rotación' },
      { fecha: 'Mar 08/12 · 09:00', accion: 'ROTACIÓN +7 DÍAS', ref: 'ZAG-ALQ-09', prop: 'Sale NOVEDAD de ZAG-ALQ-08 · Entra Centro Maldonado 2D ($U 32.000/mes)', regla: 'Nueva etiqueta NOVEDAD por 7 días' },
      { fecha: 'Jue 10/12 · 09:00', accion: 'PASAR A ALQUILADO', ref: 'ZAG-ALQ-04', prop: 'Maldonado Residencial · 2D losa radiante ($U 52.000/mes)', regla: '🔒 ALQUILADO +2 días tras rotación' }
    ];

    function renderCalendarioRotacionVidriera() {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>📅 Agenda Programada de Rotación de Vidriera (NOVEDAD → Activa → ALQUILADO)</h2>
            <span class="badge" style="color:var(--sky);border-color:rgba(183,214,224,0.35);">Ciclo perpetuo Mar/Mié/Jue</span>
          </div>
          <div style="font-size:12px;color:var(--sky);margin-bottom:10px;">
            Martes entra propiedad siguiente con etiqueta <strong>NOVEDAD</strong> (se quita automáticamente a los 7 días). Miércoles/Jueves pasa la ancla previa a <strong>🔒 ALQUILADO</strong> con su pieza en Aprobalo y anexo SEO indexado en Google.
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Fecha / Hora</th><th>Movimiento</th><th>Propiedad</th><th>Regla ejecutada</th></tr></thead>
              <tbody>
                ${ROTACION_VIDRIERA_AGENDA.map(r => `
                  <tr>
                    <td><strong>${esc(r.fecha)}</strong></td>
                    <td><span class="badge">${esc(r.accion)}</span></td>
                    <td><strong>${esc(r.ref)}</strong> · ${esc(r.prop)}</td>
                    <td style="font-size:12px;color:var(--sky);">${esc(r.regla)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderSwitcher() {
      document.getElementById('projectSwitcher').innerHTML = PROJECTS.map(p =>
        `<button class="proj-btn ${p.id === activeProject ? 'active' : ''}" onclick="setProject('${p.id}')">${esc(p.label)}</button>`
      ).join('');
    }

    function renderGlobal() {
      return `
        <div class="andon-bar">
          <div class="andon-title">🚨 TABLERO GLOBAL MULTI-PROYECTO · AISLAMIENTO ESTRICTO POR CUENTA_ID</div>
          <div style="font-size:12px;color:var(--bone);">Todos los proyectos comparten motor Toyota sin cruzar datos ni conectores.</div>
        </div>
        <div class="global-grid">
          ${PROJECTS.filter(p => p.id !== 'global').map(p => `
            <div class="proj-card">
              <h3>${esc(p.label)}</h3>
              <p>${esc(p.estado)}</p>
              <button class="proj-btn ${p.id === '1-zaguan' ? 'active' : ''}" onclick="setProject('${p.id}')">Abrir tablero en 1 clic</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderSlot(proj) {
      return `
        <div class="slot-panel">
          <h2>${esc(proj.label)}</h2>
          <p style="color:var(--sky);margin:8px 0 16px;">${esc(proj.estado)}</p>
          <p style="font-size:13px;color:var(--muted);">Slot aislado listo para conectar su base propia sin contaminar Zaguán.</p>
        </div>
      `;
    }

    function renderZaguan() {
      const items = zaguanData.items || [];
      const andonItems = items.filter(i => i.alerta_andon);
      const pkOk = items.filter(i => i.pokayoke_pass).length;
      const vCodes = ['TODOS', ...Object.keys(zaguanData.resumen_por_vertical || {})];

      return `
        <div class="andon-bar">
          <div class="andon-title">🚨 LUZ ANDON (${andonItems.length} focos activos · Rescate Lunes Jime MP-65 y Eduardo MP-66)</div>
          <div class="andon-pills">
            ${andonItems.map(a => `<button class="andon-pill" onclick="toggleAndon('${esc(a.id_registro)}')">${esc(a.id_registro)} · ${esc(a.nombre_persona)}</button>`).join('')}
            <button class="andon-pill" onclick="toggleAndon('')">${filterAndonOnly ? `Ver todos (${items.length})` : 'Filtrar solo Andon'}</button>
          </div>
        </div>

        <div class="grid-kpis">
          <div class="kpi-card"><div class="kpi-label">Simulaciones Validadas</div><div class="kpi-val">${sim32Data.pasaron} / ${sim32Data.total}</div><div class="kpi-sub">Meta Ads + Google Search + Objeciones</div></div>
          <div class="kpi-card"><div class="kpi-label">CRM Concatenado</div><div class="kpi-val">${items.length}</div><div class="kpi-sub">Leads hoy + Cartera + Prospección</div></div>
          <div class="kpi-card"><div class="kpi-label">Poka-Yokes Aprobados</div><div class="kpi-val">${pkOk} / ${items.length}</div><div class="kpi-sub">0 GPS crudos · 0 Padrón en vidriera</div></div>
          <div class="kpi-card"><div class="kpi-label">Meta Ads La Fortuna</div><div class="kpi-val">V2 ACTIVO</div><div class="kpi-sub">Botones auto-calificadores V2 en vivo</div></div>
        </div>

        ${renderSimuladorYBanco()}
        ${renderArbolSemaforo()}
        ${renderCalendarioRotacionVidriera()}
        ${renderSim32Audit()}

        <div class="channels-grid">
          ${CHANNELS_ZAGUAN.map(ch => `
            <div class="chan-card">
              <div class="chan-head"><span>${esc(ch.name)}</span><span class="dot dot-${ch.dot}"></span></div>
              <div style="color:var(--muted);">${esc(ch.detail)}</div>
            </div>
          `).join('')}
        </div>

        <div class="filters-bar">
          <div style="width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;">
            <div class="crm-tabs" style="margin-bottom:0;">
              <button class="tree-tab ${filterCrmTab === 'LEADS_ENTRANTES' ? 'active' : ''}" onclick="setCrmTab('LEADS_ENTRANTES')">1 · Leads Entrantes (Jime, Eduardo y Demanda)</button>
              <button class="tree-tab ${filterCrmTab === 'CARTERA_ACTIVA' ? 'active' : ''}" onclick="setCrmTab('CARTERA_ACTIVA')">2 · Cartera Activa (La Fortuna, Santa Mónica, 5 Pozos)</button>
              <button class="tree-tab ${filterCrmTab === 'PROSPECCION' ? 'active' : ''}" onclick="setCrmTab('PROSPECCION')">3 · Prospección Dueños y Desarrolladoras</button>
              <button class="tree-tab ${filterCrmTab === 'TODOS' ? 'active' : ''}" onclick="setCrmTab('TODOS')">4 · Todos (${items.length})</button>
            </div>
            <input class="search-input" type="search" placeholder="Buscar nombre, barrio o ID..." value="${esc(searchQuery)}" oninput="onSearch(this.value)">
          </div>
          <div class="v-pills">
            ${vCodes.map(vc => `<button class="v-pill ${filterV === vc ? 'active' : ''}" onclick="setVerticalFilter('${vc}')">${vc}${vc !== 'TODOS' ? ` (${zaguanData.resumen_por_vertical[vc]})` : ''}</button>`).join('')}
          </div>
        </div>

        <div class="main-split">
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID / Vertical</th><th>Persona / Zona</th><th>Valor / Estado</th><th>Control</th></tr></thead>
              <tbody id="itemsTbody"></tbody>
            </table>
          </div>
          <aside class="drawer" id="detailDrawer"></aside>
        </div>
      `;
    }

    function render() {
      renderSwitcher();
      const root = document.getElementById('appRoot');
      if (activeProject === 'global') {
        root.innerHTML = renderGlobal();
      } else if (activeProject === '1-zaguan') {
        root.innerHTML = renderZaguan();
        renderSimChipsOnly();
        updateSimOutputOnly();
        renderTableAndDrawer();
      } else {
        const proj = PROJECTS.find(p => p.id === activeProject);
        root.innerHTML = renderSlot(proj);
      }
    }

    render();
  </script>
</body>
</html>
