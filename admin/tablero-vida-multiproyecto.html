      --surface: #0F2738;
      --surface-2: #16374D;

      --bone: #F3EFE6;
      --sky: #B7D6E0;
      --text: #F5F7FA;
      --muted: #9FB3C8;
      --green: #10B981;
      --amber: #F59E0B;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      color: var(--text);
      line-height: 1.45;
      padding-bottom: 64px;
    }
    h1, h2, h3, h4 { font-family: 'Archivo', sans-serif; letter-spacing: -0.02em; }

    .topbar {
      background: rgba(8, 21, 33, 0.96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .topbar-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title-group h1 { font-size: 20px; color: var(--bone); }
    .title-group p { font-size: 12px; color: var(--sky); }
    .project-switcher { display: flex; flex-wrap: wrap; gap: 8px; }
    .proj-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .proj-btn:hover { border-color: var(--sky); color: var(--bone); }
    .proj-btn.active { background: var(--bone); color: #081521; border-color: var(--bone); }

    .andon-bar {

      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .andon-title { font-weight: 700; font-size: 13px; color: #FCD34D; display: flex; align-items: center; gap: 8px; }
    .andon-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .andon-pill {
      background: rgba(8, 21, 33, 0.75);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--bone);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .andon-pill:hover { background: var(--amber); color: #081521; }

    .grid-kpis {

      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .kpi-val { font-size: 26px; font-weight: 800; color: var(--bone); margin: 4px 0; }
    .kpi-sub { font-size: 12px; color: var(--sky); }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .chan-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .chan-head { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; color: var(--bone); }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot-green { background: var(--green); }
    .dot-amber { background: var(--amber); }
    .dot-red { background: var(--red); }

    .filters-bar {

      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;

          { tag: 'Turno 2 · Visita + Datos separados', cls: 'sla-t3', txt: 'Impecable. Para cuántas personas sería el alquiler y qué día y franja horaria te queda cómodo para ir a verlo?' }

      },
      {
        key: 'FAMILIA_B',
        tab: 'Familia B · Compra / Lote / Proyecto (D3..D7)',
        tipoFicha: 'Tipo 2 · Franja Gris con Bóveda Privada (USD 160.000)',
        reglas: 'Ticket USD 160.000 en botones del anuncio · 0 promesa de ubicación exacta y 0 Padrón público en T0 · Video completo (2m31s) y Cédula Catastral como anzuelo tras filtrar intención/liquidez.',
        pasos: [
          { tag: 'T0 · Botón 1 (Compra contado USD 160k)', cls: 'sla-t0', txt: 'Te comparto la ficha pública de Santa Mónica (lote propio 348 m², 201 m² en hormigón armado frente a la Laguna, USD 160.000): https://zaguanpropiedades.com/propiedades/santa-monica-casa-hormigon/\nPara pasarte el video completo de 2m31s y la cédula catastral con número de padrón: lo evaluás para vivienda propia o para inversión?' },
          { tag: 'T0 · Botón 2 (Cruce D7 Lote vs. Obra)', cls: 'sla-t1', txt: 'Acá ves la ficha y el croquis proyectable en dos plantas de Santa Mónica (USD 160.000): https://zaguanpropiedades.com/propiedades/santa-monica-casa-hormigon/\nPara liberarte el video completo de 2m31s y el decreto de regularización hasta dic. 2027: contás con fondos en USD para evaluar compra directa?' },
          { tag: 'T2 · Naranja (24 hs)', cls: 'sla-t2', txt: 'Te consulto corto: te interesa que te envíe el video completo y el croquis de Santa Mónica (USD 160.000), o estás buscando terreno libre / casa terminada?' },
          { tag: 'Turno 2 · Bóveda Privada', cls: 'sla-t3', txt: 'Entrega controlada desde Bóveda Privada (Mac/D1): Padrón, Manzana, Carpeta, DJCU vigente y PDF de Cédula Catastral + envío del video completo (2m31s) y pregunta de forma de pago / visita.' }
        ]
      },
      {
        key: 'FAMILIA_C',
        tab: 'Familia C · Pozo / Desarrolladora (D1)',
        tipoFicha: 'Tipo 1 · Abierta (Ficha Única)',
        reglas: 'El desarrollador registra al cliente por protocolo formal (cero riesgo de puenteo). 1 link a /proyectos/ + pregunta de tipología y cuotas en obra.',
        pasos: [
          { tag: 'T0 · Inmediato (0 min)', cls: 'sla-t0', txt: 'Podés ver los 5 desarrollos en pozo activos hoy (desde USD 79.800 en Maldonado y Punta del Este) en https://zaguanpropiedades.com/proyectos/\nQué tipología buscás (1, 2 o 3 dormitorios) y necesitás financiar en cuotas durante la obra?' },
          { tag: 'T1 · Amarillo (30 min sin respuesta)', cls: 'sla-t1', txt: 'Querés que te arme la comparativa directa de 2 unidades en obra con gastos de ocupación incluidos según tu tope de anticipo?' },
          { tag: 'T2 · Naranja (24 hs)', cls: 'sla-t2', txt: 'Seguimos con listas vigentes en Punta del Este y Maldonado desde USD 79.800. Si me pasás tu rango de anticipo, te mando las 2 opciones con mejor retorno neto.' },
          { tag: 'Turno 2 · Pre-registro', cls: 'sla-t3', txt: 'Excelente. Comprás como residente o desde el exterior (para pasarte los costos totales de cierre y dejar hecho el pre-registro formal)? Qué día te queda cómodo para verlo?' }
        ]
      },
      {
        key: 'FAMILIA_D',
        tab: 'Familia D · Dueños Directos (O1..O6)',
        tipoFicha: 'Captación Franja Gris · Sin Exclusividad',
        reglas: 'Cero % ni comisiones en 1° contacto · Prohibido enviar URL de ficha pública al dueño · Garantías aseguradoras solo si es alquiler (O6), nunca en ventas.',
        pasos: [
          { tag: 'T0 · 1° Contacto limpio', cls: 'sla-t0', txt: 'Hola, cómo estás? Te escribe Mar, de ZAGUÁN Propiedades. Trabajamos en Punta del Este y Maldonado con publicación abierta sin exclusividad y filtro previo de interesados antes de cada visita. Tu propiedad sigue disponible para confirmarnos barrio y valor pretendido?' },
          { tag: 'T1 · Amarillo (2 hs · Audio fácil)', cls: 'sla-t1', txt: 'Si te queda más cómodo, podés mandarme un audio corto contándome metros, estado y condiciones principales de tu propiedad para cruzarlo con búsquedas activas hoy.' },
          { tag: 'T2 · Naranja (24 hs)', cls: 'sla-t2', txt: 'Seguimos recibiendo consultas en la zona. Cuando puedas pasame esos datos mínimos y la sumamos a nuestra carpeta abierta sin exclusividad.' },
          { tag: 'Turno 2 · Capa 2 + Bienvenida OKs', cls: 'sla-t3', txt: 'Recibido. Para armar nuestra carpeta interna (cuidando los datos sensibles antes de publicar), podés enviarnos por acá el PDF catastral / DJCU si lo tenés a mano, video de recorrido y confirmarnos qué horarios sirven para visitas?' }
        ]
      }
    ];
    let activeTreeKey = 'FAMILIA_A';
    window.selectTreeFamily = function(k) { activeTreeKey = k; render(); };
    window.copyTreeText = function(k, idx) {
      const fam = ARBOL_SLA.find(x => x.key === k);
      if (fam && fam.pasos[idx]) navigator.clipboard.writeText(fam.pasos[idx].txt);
    };
    function renderArbolSemaforo() {
      const fam = ARBOL_SLA.find(x => x.key === activeTreeKey) || ARBOL_SLA[0];
      return `
        <section class="tree-panel">
          <div class="tree-header">
            <h2>🌳 Árbol Estratégico y Semáforo SLA · ${esc(fam.tipoFicha)}</h2>
            <span class="badge badge-ok">1 link · 0 GPS crudo en T0 · 0 preguntas encadenadas</span>
          </div>
          <div class="tree-tabs">
            ${ARBOL_SLA.map(f => `<button class="tree-tab ${f.key === fam.key ? 'active' : ''}" onclick="selectTreeFamily('${f.key}')">${esc(f.tab)}</button>`).join('')}
          </div>
          <div class="tree-rules"><strong>Frenos Poka-Yoke:</strong> ${esc(fam.reglas)}</div>
          <div class="sla-grid">
            ${fam.pasos.map((p, idx) => `
              <div class="sla-card">
                <div>
                  <span class="sla-badge ${p.cls}">${esc(p.tag)}</span>
                  <div class="sla-body">${esc(p.txt)}</div>
                </div>
                <div><button class="btn-copy" style="margin-left:0;" onclick="copyTreeText('${fam.key}', ${idx})">Copiar respuesta</button></div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderZaguan() {
      const items = zaguanData.items || [];
      const andonItems = items.filter(i => i.alerta_andon);
      const pkOk = items.filter(i => i.pokayoke_pass).length;
      const vCodes = ['TODOS', ...Object.keys(zaguanData.resumen_por_vertical || {})];

      return `
        <div class="andon-bar">
          <div class="andon-title">🚨 LUZ ANDON (${andonItems.length} focos activos para decisión de Ariana)</div>
          <div class="andon-pills">
            ${andonItems.map(a => `<button class="andon-pill" onclick="toggleAndon('${esc(a.id_registro)}')">${esc(a.id_registro)} · ${esc(a.nombre_persona)}</button>`).join('')}
            <button class="andon-pill" onclick="toggleAndon('')">${filterAndonOnly ? 'Ver todos los ${items.length}' : 'Filtrar solo Andon'}</button>
          </div>
        </div>

        <div class="grid-kpis">
          <div class="kpi-card">
            <div class="kpi-label">Registros Concatenados</div>
            <div class="kpi-val">${items.length}</div>
            <div class="kpi-sub">100% desde Planilla Master CSV</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Poka-Yokes Aprobados</div>
            <div class="kpi-val">${pkOk} / ${items.length}</div>
            <div class="kpi-sub">Candado Franja Gris + Linter Mar</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Verticales Activas (O1..O7/D2)</div>
            <div class="kpi-val">${Object.keys(zaguanData.resumen_por_vertical || {}).length}</div>
            <div class="kpi-sub">Cruces latentes X &rarr; Y cargados</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Pauta Meta Ads</div>
            <div class="kpi-val">ACTIVA</div>
            <div class="kpi-sub">La Fortuna ($7.962 ARS/d · WhatsApp)</div>
          </div>
        </div>

        <div class="channels-grid">
          ${CHANNELS_ZAGUAN.map(ch => `
            <div class="chan-card">
              <div class="chan-head"><span>${esc(ch.name)}</span><span class="dot dot-${ch.dot}"></span></div>
              <div style="color:var(--muted);">${esc(ch.detail)}</div>
            </div>
          `).join('')}
        </div>

        ${renderArbolSemaforo()}

        <div class="filters-bar">
          <div class="v-pills">
            ${vCodes.map(vc => `
              <button class="v-pill ${filterV === vc ? 'active' : ''}" onclick="setVerticalFilter('${vc}')">
                ${vc}${vc !== 'TODOS' ? ` (${zaguanData.resumen_por_vertical[vc]})` : ''}
              </button>
            `).join('')}
          </div>
          <input class="search-input" type="search" placeholder="Buscar dueño, zona, ID o precio..." value="${esc(searchQuery)}" oninput="onSearch(this.value)">
        </div>

        <div class="main-split">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID / Vertical</th>
                  <th>Persona / Zona</th>
                  <th>Valor / Estado</th>
                  <th>Control</th>
                </tr>
              </thead>
              <tbody id="itemsTbody"></tbody>
            </table>
          </div>
          <aside class="drawer" id="detailDrawer"></aside>
        </div>
      `;
    }

    function render() {
      renderSwitcher();
      const root = document.getElementById('appRoot');
      if (activeProject === 'global') {
        root.innerHTML = renderGlobal();
      } else if (activeProject === '1-zaguan') {
        root.innerHTML = renderZaguan();
        renderTableAndDrawer();
      } else {
        const proj = PROJECTS.find(p => p.id === activeProject);
        root.innerHTML = renderSlot(proj);
      }
    }

    render();
  </script>
</body>
</html>
