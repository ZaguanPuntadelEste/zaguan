<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador QR · ZAGUÁN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --zaguan-estuario: #123B4A;
      --zaguan-bigua: #081521;
      --zaguan-bone: #F3F0E8;
      --zaguan-mist: #D9DDDA;
      --font-display: "Archivo", sans-serif;
      --font-body: "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 18px;
      color: var(--zaguan-bigua);
      background: var(--zaguan-bone);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 600;
    }

    p {
      margin: 0;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-size: 0.9375rem;
      font-weight: 600;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid var(--zaguan-mist);
      border-radius: 8px;
      color: var(--zaguan-bigua);
      background: #ffffff;
      font: 400 1rem/1.3 var(--font-body);
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(27, 84, 99, 0.32);
      outline-offset: 2px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid var(--zaguan-estuario);
      border-radius: 8px;
      color: var(--zaguan-bone);
      background: var(--zaguan-estuario);
      font: 600 0.9375rem/1.2 var(--font-body);
      cursor: pointer;
    }

    button.secondary {
      color: var(--zaguan-estuario);
      background: transparent;
    }

    #output {
      display: inline-block;
      margin-top: 30px;
      padding: 24px;
      background: var(--zaguan-bone);
    }

    #output svg {
      display: block;
      width: min(100%, 420px);
      height: auto;
    }

    .status {
      min-height: 24px;
      margin-top: 14px;
      color: var(--zaguan-bigua);
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <main>
    <h1>Generador QR · ZAGUÁN</h1>
    <p>Generá QR en SVG o PNG para impresión.</p>

    <label for="file-name">Nombre del archivo</label>
    <input id="file-name" type="text" value="qr-ariana-01">

    <label for="url">URL a codificar</label>
    <input
      id="url"
      type="url"
      value="https://zaguanpropiedades.com/tarjetaAW"
    >

    <div class="buttons">
      <button id="generate" type="button">Generar QR</button>
      <button id="download-svg" type="button">Descargar SVG</button>
      <button id="download-png" class="secondary" type="button">Descargar PNG</button>
    </div>

    <div id="output" aria-label="Código QR generado"></div>
    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <script>
    const QR_LIBRARY_URL =
      "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";

    const QR_COLOR = "#081521";
    const QR_BACKGROUND = "#F3F0E8";

    const output = document.getElementById("output");
    const status = document.getElementById("status");

    function loadQrLibrary() {
      return new Promise((resolve, reject) => {
        if (typeof qrcode === "function") {
          resolve();
          return;
        }

        const script = document.createElement("script");
        script.src = QR_LIBRARY_URL;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function getFormData() {
      return {
        fileName:
          document.getElementById("file-name").value.trim() || "qr-zaguan",
        url: document.getElementById("url").value.trim()
      };
    }

    async function generateQr() {
      const { url } = getFormData();

      if (!url) {
        status.textContent = "Ingresá una URL.";
        return null;
      }

      try {
        await loadQrLibrary();

        const qr = qrcode(0, "M");
        qr.addData(url);
        qr.make();

        output.innerHTML = qr.createSvgTag({
          cellSize: 12,
          margin: 4,
          scalable: true
        });

        const svg = output.querySelector("svg");

        svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", "Código QR ZAGUÁN");
        svg.style.display = "block";
        svg.style.background = QR_BACKGROUND;

        svg.querySelectorAll("path").forEach((path) => {
          path.setAttribute("fill", QR_COLOR);
        });

        status.textContent = "QR generado.";
        return svg;
      } catch (error) {
        status.textContent =
          "No se pudo cargar la librería. Verificá que tengas conexión a internet.";
        return null;
      }
    }

    function downloadBlob(blob, fileName) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }

    async function downloadSvg() {
      const svg = output.querySelector("svg") || await generateQr();

      if (!svg) {
        return;
      }

      const { fileName } = getFormData();
      const serializedSvg = new XMLSerializer().serializeToString(svg);

      const blob = new Blob([serializedSvg], {
        type: "image/svg+xml;charset=utf-8"
      });

      downloadBlob(blob, `${fileName}.svg`);
      status.textContent = "SVG descargado.";
    }

    async function downloadPng() {
      const svg = output.querySelector("svg") || await generateQr();

      if (!svg) {
        return;
      }

      const { fileName } = getFormData();
      const serializedSvg = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([serializedSvg], {
        type: "image/svg+xml;charset=utf-8"
      });

      const objectUrl = URL.createObjectURL(svgBlob);
      const image = new Image();

      image.onload = function () {
        const size = 1600;
        const canvas = document.createElement("canvas");

        canvas.width = size;
        canvas.height = size;

        const context = canvas.getContext("2d");

        context.fillStyle = QR_BACKGROUND;
        context.fillRect(0, 0, size, size);
        context.drawImage(image, 0, 0, size, size);

        canvas.toBlob(function (blob) {
          if (blob) {
            downloadBlob(blob, `${fileName}.png`);
            status.textContent = "PNG 1600 × 1600 px descargado.";
          }

          URL.revokeObjectURL(objectUrl);
        }, "image/png");
      };

      image.onerror = function () {
        status.textContent = "No se pudo generar el PNG.";
        URL.revokeObjectURL(objectUrl);
      };

      image.src = objectUrl;
    }

    document
      .getElementById("generate")
      .addEventListener("click", generateQr);

    document
      .getElementById("download-svg")
      .addEventListener("click", downloadSvg);

    document
      .getElementById("download-png")
      .addEventListener("click", downloadPng);

    generateQr();
  </script>
</body>
</html>
