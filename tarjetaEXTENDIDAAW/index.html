  <style>
    :root {
      --zaguan-estuario: #123B4A;
      --zaguan-bigua: #081521;
      --zaguan-black: #05090D;
      --zaguan-bone: #F3F0E8;
      --zaguan-limestone: #E8E4DA;
      --zaguan-mist: #D9DDDA;
      --zaguan-feather: #66717A;
      --zaguan-umbral: #1B5463;

      --font-display: "Archivo", sans-serif;
      --font-body: "Inter", sans-serif;

      --radius: 16px;
      --focus-ring: 0 0 0 4px rgba(27, 84, 99, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--zaguan-bone);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--zaguan-bigua);
      background: var(--zaguan-bone);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .contact-page {
      width: min(100%, 460px);
      text-align: center;
    }

    .brand {
      display: block;
      width: min(100%, 270px);
      height: auto;
      margin: 0 auto 42px;
    }

    h1 {
      margin: 0;
      color: var(--zaguan-bigua);
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.08;
    }

    .role {
      min-height: 1.45em;
      margin: 12px 0 0;
      color: var(--zaguan-feather);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .message {
      max-width: 34ch;
      margin: 28px auto 0;
      color: var(--zaguan-bigua);
      font-family: var(--font-body);
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.55;
    }

    .primary-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      margin-top: 32px;
      padding: 14px 20px;
      border: 1px solid var(--zaguan-estuario);
      border-radius: var(--radius);
      color: var(--zaguan-bone);
      background: var(--zaguan-estuario);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .primary-action:hover {
      border-color: var(--zaguan-umbral);
      background: var(--zaguan-umbral);
    }

    .primary-action:active {
      transform: translateY(1px);
    }

    .primary-action:focus-visible,
    .secondary-link:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .notice {
      margin: 12px 0 0;
      color: var(--zaguan-feather);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.45;
    }

    .secondary-link {
      display: inline-block;
      margin-top: 30px;
      color: var(--zaguan-bigua);
      font-family: var(--font-body);
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    @media (max-height: 650px) {
      main {
        align-items: start;
        padding-top: 32px;
      }

      .brand {
        width: 220px;
        margin-bottom: 26px;
      }

      .message {
        margin-top: 18px;
      }

      .primary-action {
        margin-top: 22px;
      }

      .secondary-link {
        margin-top: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .primary-action {
        transition: none;
      }
    }
  </style>
</head>
